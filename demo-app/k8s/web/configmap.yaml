# Nginx 설정 ConfigMap
# React 정적 파일 서빙 + /demo-app/api/* 요청을 API Service로 프록시한다
# 앱은 /demo-app 경로 하위에서 서빙된다 (클러스터 운영 중인 설정 기준)
# K8s 환경에서는 package.json의 proxy 설정 대신 Nginx 프록시를 사용한다

apiVersion: v1
kind: ConfigMap
metadata:
  name: web-nginx-config
  namespace: demo-app
data:
  default.conf: |
    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # /demo-app/api/* → FastAPI 프록시
        location /demo-app/api/ {
            rewrite ^/demo-app/api/(.*) /api/$1 break;
            proxy_pass         http://api:8000;
            proxy_http_version 1.1;
            proxy_set_header   Host          $host;
            proxy_set_header   X-Real-IP     $remote_addr;
            proxy_read_timeout 60s;
        }

        # /demo-app/static/* → 실제 /static/* 파일 서빙
        location /demo-app/static/ {
            alias /usr/share/nginx/html/static/;
        }

        # /demo-app 진입점 → index.html
        location /demo-app {
            try_files $uri /index.html;
        }

        # 기본
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
